[package]
name = "moonblokz-crypto"
version = "1.0.0"
edition = "2024"
description = "Moonblokz crypto library"
license = "MIT"
homepage = "moonblokz.com"
authors = ["Peter Sallai (Bad Access)<peter.sallai@badaccess.eu>"]
keywords = ["moonblokz", "crypto", "schnorr", "bls"]
repository = "https://github.com/petersallai/moonblokz-crypto-lib"
readme = "README.md"
categories = ["crypto"]

[dependencies]
# Schnorr: BIP-340 through k256 (pure Rust, no allocator; DEC-235 / Story 6.16).
k256 = { version = "0.14", default-features = false, features = ["arithmetic", "schnorr"], optional = true }
# BLS: zkcrypto bls12_381 (no allocator; `sqrt-table` and `alloc` stay off).
bls12_381 = { version = "0.9.2", default-features = false, features = ["groups", "pairings", "experimental"], optional = true }
# bls12_381's hash-to-curve is bound to digest 0.10, hence sha2 0.10 on the BLS side only.
sha2 = { version = "0.10", default-features = false, optional = true }

[features]
default = ["schnorr"]

# BIP-340 Schnorr on secp256k1 (k256).
schnorr = ["dep:k256"]

# BLS12-381, IETF proof-of-possession suite, signatures in G1 and keys in G2.
bls-min-sig = ["bls"]

# BLS12-381, IETF proof-of-possession suite, keys in G1 and signatures in G2.
bls-min-pk = ["bls"]

# Private helper enabled by both BLS variants; not a backend on its own.
bls = ["dep:bls12_381", "dep:sha2"]
